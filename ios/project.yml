name: BitChord
options:
  bundleIdPrefix: io.github.rtk19
  deploymentTarget:
    iOS: '16.4'
  xcodeVersion: '16.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.4'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  BitChord:
    type: application
    platform: iOS
    sources:
      - path: BitChord
        excludes: [Web, Info.plist]
      - path: BitChord/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rtk19.BitChord
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: BitChord/Info.plist
    info:
      path: BitChord/Info.plist
      properties:
        CFBundleDisplayName: BitChord
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  BitChordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BitChordUITests]
    dependencies:
      - target: BitChord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rtk19.BitChord.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BitChord:
    build:
      targets:
        BitChord: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets: [BitChordUITests]

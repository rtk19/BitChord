name: iOS upstream sync

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ios-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'rtk19/BitChord'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Propose latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ios/sync-upstream.sh
